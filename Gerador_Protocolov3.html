<title>Gerador de Protocolos — Umuarama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 20h44v24L32 60 10 44z' fill='%23f28c00'/%3E%3Cpath d='M23 6h18v38H23z' fill='%23fcc684'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Gerador de Protocolos — Umuarama
   1. Interface (identidade visual do Portal Umuarama V6)
   2. Impressão (geometria do MODELO - Protocolo.xlsx; não depende da tela)
   ========================================================================== */

/* ---------- 1. Interface ---------- */
:root {
  --bg: #f3f2f2; --text: #201f1d; --accent: #f28c00; --divider: rgba(32, 31, 29, .16);
  --n100: #f8f4f4; --n200: #eae7e7; --n300: #d7d3d3; --n400: #bab6b6; --n500: #9b9797;
  --n600: #7d7979; --n700: #605d5d; --n800: #444141; --n900: #2d2b2b;
  --a100: #fff4e5; --a200: #ffe1bb; --a600: #cf7400; --a700: #a25a00; --a800: #78420a;
  --err: #9b1c1c; --err-bg: #fdf1f1;
  --font: Ebrima, "Nirmala UI", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r-md: 4px;
  --shadow-lg: 0 12px 32px rgba(45, 43, 43, .22);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.55; }
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.topbar-bar { height: 4px; background: var(--accent); }
.topbar { background: var(--bg); border-bottom: 1px solid var(--divider); }
.topbar-in { max-width: 1180px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; }
.brand img { display: block; height: 30px; width: auto; mix-blend-mode: multiply; }
.title { margin: 0; font-size: 26px; font-weight: 400; line-height: 1.15; letter-spacing: .005em; }
.title strong { font-weight: 700; }
.meta { margin-left: auto; }
.link-quiet { padding: 0; border: 0; background: none; cursor: pointer; font-size: 12px; color: var(--a700); text-decoration: underline; text-underline-offset: 3px; }
.link-quiet:hover { color: var(--a600); }

.content { max-width: 1180px; margin: 0 auto; padding: 28px 32px 64px; }
.back { margin: 0 0 18px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 13px; color: var(--a700); }
.back:hover { color: var(--a600); text-decoration: underline; text-underline-offset: 3px; }
.foot { margin-top: 40px; font-size: 10.5px; color: var(--n600); }

/* Dois caminhos da tela inicial */
.paths { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 8px; border-top: 2px solid var(--text); padding-top: 28px; }
.path {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; min-height: 230px; padding: 28px 30px; text-align: left; cursor: pointer;
  color: var(--text); background: var(--bg); border: 1px solid var(--divider); border-radius: var(--r-md);
}
.path:hover, .path:focus-visible { background: var(--a100); border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.path-ico { width: 56px; height: 56px; stroke: var(--accent); }
.path-t { font-size: 28px; font-weight: 600; line-height: 1.15; }

/* Formulários */
.form { max-width: 720px; }
.fgroup { margin-bottom: 22px; }
.fgroup > label, .lbl { display: block; margin-bottom: 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--n700); }
.fin { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--n400); border-radius: var(--r-md); background: #fff; color: var(--text); font-size: 15px; }
.fin:hover { border-color: var(--n500); }
.fin:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
select.fin { cursor: pointer; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 12px; max-width: 420px; margin-top: 12px; }
.sub { margin-top: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.seg button { padding: 9px 18px; border: 1px solid var(--divider); border-radius: var(--r-md); background: transparent; cursor: pointer; font-size: 14px; color: var(--n800); }
.seg button:hover { border-color: var(--n500); }
.seg button[aria-pressed="true"] { background: var(--a100); border-color: var(--accent); color: var(--a800); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 10px 22px; border: 1px solid transparent; border-radius: var(--r-md); background: transparent; font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--a600); border-color: var(--a600); }
.btn-primary:disabled { background: var(--n300); border-color: var(--n300); color: var(--n600); cursor: not-allowed; }
.btn-sec { border-color: var(--n400); font-weight: 500; }
.btn-sec:hover { background: rgba(32, 31, 29, .07); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.alert { margin: 0 0 18px; padding: 12px 16px; border: 1px solid rgba(155, 28, 28, .35); border-left: 4px solid var(--err); background: var(--err-bg); color: var(--err); font-size: 13.5px; }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.hint { margin-top: 6px; font-size: 12px; color: var(--n700); }
.warn { color: var(--err); }

/* Campo de condomínio pesquisável */
.combo { position: relative; }
.combo .fin { padding-right: 36px; }
.combo-clear { position: absolute; right: 6px; top: 8px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--n700); cursor: pointer; font-size: 16px; line-height: 1; }
.combo-clear:hover { background: var(--n200); }
.combo-list { position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 2px); max-height: 300px; overflow-y: auto; margin: 0; padding: 4px 0; list-style: none; background: #fff; border: 1px solid var(--n400); border-radius: var(--r-md); box-shadow: var(--shadow-lg); }
.combo-list li { padding: 7px 12px; cursor: pointer; font-size: 14px; display: flex; gap: 10px; }
.combo-list li b { flex: 0 0 auto; min-width: 38px; color: var(--accent); font-variant-numeric: tabular-nums; }
.combo-list li[aria-selected="true"], .combo-list li:hover { background: var(--a100); }
.combo-list .vazio { padding: 10px 12px; color: var(--n700); font-size: 13px; cursor: default; }

/* Conferência do lote de pastas */
.conf-head { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--text); }
.conf-t { font-size: 22px; font-weight: 600; }
.conf-n { margin-top: 6px; font-weight: 600; color: var(--a800); }
.conf-list { margin: 0 0 22px; padding: 0; list-style: none; border-top: 1px solid var(--divider); max-width: 760px; }
.conf-list li { border-bottom: 1px solid var(--divider); }
.conf-list label { display: flex; align-items: baseline; gap: 8px; padding: 10px 6px; cursor: pointer; font-size: 15px; }
.conf-list label input { margin-right: 6px; }
.conf-list label:hover { background: var(--a100); }
.conf-list input { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; align-self: center; }
.conf-list b { min-width: 34px; color: var(--accent); font-variant-numeric: tabular-nums; }
.conf-tools { margin: 0 0 12px; }
.conf-list .pasta { margin-left: auto; font-style: normal; font-size: 11px; letter-spacing: .04em; padding: 1px 8px; border-radius: 3px; background: var(--n200); color: var(--n700); }
.conf-list .pasta.fis { background: var(--a100); color: var(--a800); }
.conf-list .prob { display: block; margin-left: 66px; padding: 0 6px 10px; font-size: 12.5px; color: var(--err); }

/* Protocolos personalizados */
.rows { margin-bottom: 14px; border-top: 1px solid var(--divider); }
.lin { display: grid; grid-template-columns: 34px minmax(220px, 1.5fr) minmax(190px, 1.1fr) minmax(200px, 1.4fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--divider); }
.lin.erro { background: var(--err-bg); }
.lin-n { padding-top: 9px; font-size: 13px; color: var(--n700); font-variant-numeric: tabular-nums; }
.lin .fin { min-height: 38px; font-size: 14px; }
.lin .sub { margin-top: 8px; }
.lin-acoes { display: flex; gap: 6px; padding-top: 2px; }
.lin-acoes button { padding: 7px 12px; border: 1px solid var(--n400); border-radius: var(--r-md); background: transparent; cursor: pointer; font-size: 13px; color: var(--n800); }
.lin-acoes button:hover { background: rgba(32, 31, 29, .07); }
.lin-acoes .rm:hover { color: var(--err); border-color: var(--err); }
.lin-msg { grid-column: 2 / -1; font-size: 12.5px; color: var(--err); }
.lin .lbl-m { display: none; }

/* Revisão */
.rev-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; margin: 0 -32px 22px; padding: 12px 32px; background: var(--bg); border-bottom: 1px solid var(--text); }
.rev-info { font-size: 14px; color: var(--n800); }
.rev-info b { font-size: 17px; color: var(--text); }
.rev-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.prev-page { position: relative; margin: 0 auto 26px; background: #fff; overflow: hidden; box-shadow: 0 2px 14px rgba(45, 43, 43, .22); }
.prev-page .pagina { transform-origin: 0 0; }
.prev-tag { margin: 0 auto 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--n700); }

@media (max-width: 900px) {
  .topbar-in { padding: 12px 16px; } .content { padding: 18px 16px 48px; }
  .paths { grid-template-columns: 1fr; } .path { min-height: 150px; }
  .lin { grid-template-columns: 1fr; } .lin-n { padding-top: 0; } .lin-msg { grid-column: 1; }
  .rev-bar { margin: 0 -16px 18px; padding: 10px 16px; }
}

/* ---------- 2. Impressão ----------
   A4 paisagem, margem zero: toda a geometria vem do próprio desenho (unidades físicas, pt), conferida contra o
   PDF exportado pelo Excel a partir do MODELO - Protocolo.xlsx. Sem transform/escala: 100%. */
#print-root { display: none; }
.pagina { position: relative; width: 297mm; height: 210mm; background: #fff; overflow: hidden; }
.pagina svg { display: block; width: 297mm; height: 210mm; }
.pagina text { text-rendering: geometricPrecision; }
@page { size: 297mm 210mm; margin: 0; }
@media print {
  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; width: 297mm; }
  body > *:not(#print-root):not(#defs-svg) { display: none !important; }
  #print-root { display: block !important; }
  #print-root .pagina { width: 297mm; height: 209.8mm; break-after: page; page-break-after: always; margin: 0; }
  #print-root .pagina:last-child { break-after: auto; page-break-after: auto; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<!-- Base corporativa: snapshot dos JSON do Portal Umuarama V6 (somente os campos necessários ao protocolo) -->
<script id="base-dados" type="application/json">{}</script>

<script>
(() => {
'use strict';

/* ==========================================================================
   1. Base, utilidades
   ========================================================================== */
let BASE = { condominios: [], carteiras: [] };
let CONDS = [];
let POR_CODIGO = new Map();
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

/** Lê o JSON embutido em <script id="base-dados">. Devolve null se estiver ausente, vazio ou inválido. */
function lerBaseEmbutida() {
  try {
    const el = document.getElementById('base-dados');
    const txt = el ? el.textContent.trim() : '';
    if (!txt || txt === '{}') return null;
    return JSON.parse(txt);
  } catch (erro) {
    console.warn('Base embutida (#base-dados) inválida:', erro);
    return null;
  }
}

/** Normaliza a base: aceita { condominios: [...] }, um array puro ou lixo; nunca lança erro. */
function normalizarBase(bruta) {
  let b = bruta;
  if (Array.isArray(b)) b = { condominios: b };
  if (!b || typeof b !== 'object') b = {};
  const condominios = (Array.isArray(b.condominios) ? b.condominios : [])
    .filter(c => c && typeof c === 'object' && !vazio(c.codigo))
    .map(c => ({ ...c, codigo: String(c.codigo).trim() }));
  // O JSON do Power Automate traz só "condominios": sem "carteiras", gera a lista a partir de cada condomínio.
  let carteiras = Array.isArray(b.carteiras)
    ? b.carteiras.filter(k => k && Number.isFinite(Number(k.carteira))).map(k => ({ carteira: Number(k.carteira), gerente: k.gerente || '' }))
    : [];
  if (!carteiras.length) {
    const nums = [...new Set(condominios.map(c => Number(c.carteira)).filter(n => Number.isFinite(n) && n > 0))].sort((x, y) => x - y);
    carteiras = nums.map(n => ({ carteira: n, gerente: '' }));
  }
  return { ...b, condominios, carteiras };
}

/** Carrega a base: base_dados.json → <script id="base-dados"> → estrutura vazia. Sempre resolve. */
async function carregarBaseDados() {
  let bruta = null;
  try {
    const resposta = await fetch('base_dados.json', { cache: 'no-cache' });
    if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
    bruta = await resposta.json();
  } catch (erro) {
    console.warn('base_dados.json indisponível; usando a base embutida:', erro);
    bruta = lerBaseEmbutida();
  }
  try { BASE = normalizarBase(bruta); }
  catch (erro) { console.error('Base inválida; iniciando vazia:', erro); BASE = { condominios: [], carteiras: [] }; }
  CONDS = BASE.condominios.slice().sort((a, b) => Number(a.codigo) - Number(b.codigo));
  POR_CODIGO = new Map(CONDS.map(c => [c.codigo, c]));
  if (!CONDS.length) console.warn('Nenhum condomínio carregado.');
}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const vazio = v => v == null || String(v).trim() === '';
const gerenteDe = n => { const k = BASE.carteiras.find(x => x.carteira === Number(n)); return k && k.gerente ? k.gerente : null; };
const rotuloCarteira = n => `Carteira ${n}${gerenteDe(n) ? ' · ' + gerenteDe(n) : ''}`;
const grupoNumero = c => { const m = /^G\s*(\d+)$/i.exec(c.malote || ''); return m ? m[1] : null; };
const hoje = () => new Date();
const dataExtenso = d => `${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`;
const dataCurta = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const refPasta = (mes, ano) => `Pasta de Prestação de Contas - ${MESES[mes - 1]}/${ano}`;

/* ==========================================================================
   2. Regras do protocolo (13_PROTOCOLOS_EXPEDICAO_E_AR.txt)
   ========================================================================== */

/** Falta o quê? Devolve a lista de campos que impedem gerar o protocolo (nunca inventa dado). */
function faltas(item) {
  const f = [];
  const c = item.cond;
  if (!c) { f.push('Condomínio'); }
  else {
    if (vazio(c.codigo)) f.push('Código');
    if (vazio(c.nome)) f.push('Nome');
    if (vazio(c.endereco)) f.push('Endereço');
    if (grupoNumero(c) === null) f.push('Grupo de malote');
  }
  if (destinatario(item) === '') f.push('Destinatário');
  if (vazio(item.ref)) f.push('Referência');
  return f;
}
const destinatario = item => item.dest === 'sindico' ? 'Síndico' : item.dest === 'zelador' ? 'Zelador' : (item.dest === 'outro' ? String(item.destTexto || '').trim() : '');
const mensagemFalta = f => `Não é possível gerar este protocolo. Falta: ${f.join(', ')}.`;

/** Linhas de texto do protocolo, exatamente como no modelo (6 espaços de recuo, travessão em "Cód – Nome – G"). */
const RECUO = '      ';
function linhasDe(item) {
  const c = item.cond;
  return {
    dest: `${RECUO}A/C.: ${destinatario(item)}`,
    cond: `${RECUO}${c.codigo} – ${c.nome} – G${grupoNumero(c)}`,
    end: `${RECUO}${c.endereco}${vazio(c.bairro) ? '' : ' - ' + c.bairro}`,
    ref: `${RECUO}Ref.: ${String(item.ref).trim()}`
  };
}

/** Ordem do lote: código crescente; mesmo código mantém a ordem em que foi adicionado. */
const ordenar = itens => itens.map((it, i) => ({ it, i })).sort((a, b) => (Number(a.it.cond.codigo) - Number(b.it.cond.codigo)) || (a.i - b.i)).map(x => x.it);

/* ==========================================================================
   3. Motor de impressão — geometria do MODELO - Protocolo.xlsx (pt)
      Valores medidos no PDF exportado pelo Excel (A4 paisagem, zoom 99%, margens 18 / 10 mm).
   ========================================================================== */
const G = {
  pagina: [841.92, 595.32],
  slotX: [51.48, 401.69], stripY: [28.68, 295.37],     // origem (centro das linhas) de cada um dos 4 protocolos da página
  W: 350.22, H1: 174.74, H: 266.69,                    // largura; altura do protocolo; altura protocolo + fichinha
  T: 1.92, HAIR: 0.26, margem: 33.52, hairX: 33.54, medX: 33.48,
  txtX: 35.40, centroB: 191.865,
  tituloY: 13.92,
  linhas: [34.08, 56.30, 78.50, 100.70, 122.90, 145.10, 167.30],
  fich: [198.41, 215.69, 232.97, 250.25],
  letras: [['P', 13.68, 13.68], ['R', 13.44, 29.04], ['O', 12.84, 44.52], ['T', 13.92, 59.90], ['O', 12.84, 75.38], ['C', 13.68, 90.86], ['O', 12.84, 106.22], ['L', 14.28, 121.70], ['A', 13.20, 137.06], ['D', 13.08, 152.54], ['O', 12.84, 167.90]],
  logo: { x: 251.80, y: 4.02, w: 84.206, h: 19.539 },
  fonte: 9.96, fonteTitulo: 13.8, fonteLetras: 11.88, fonteMin: 7.0,
  limiteTexto: 306.0                                    // largura útil (pt) a partir do início do texto (deixa ~7 pt de folga até a borda direita)
};
// Posições sem protocolo na última página: como na planilha (texto, PROTOCOLADO e logotipo limpos), a moldura permanece.
// Para imprimir o espaço vazio totalmente liso (sem moldura nem X), troque para false e gere o build novamente.
const MOLDURA_VAZIA = true;
const FAMILIA = "Ebrima, 'Segoe UI', Arial, sans-serif";
// Linhas fixas do modelo. O Excel encurta cada sublinhado em 0,048 pt (avanço de glifo no PDF dele): replicado para o
// fim da linha de assinatura cair no mesmo ponto (medido: 392,04 pt no Excel).
const US = n => `<tspan letter-spacing="-0.048">${'_'.repeat(n)}</tspan>`;
const FIXO_RECEBEMOS = `${RECUO}Recebemos em ${US(6)}/${US(6)}/${US(10)}`;
const FIXO_ASS = `${RECUO}Por/ Ass.: ${US(60)}`;

/** Se a linha for maior que a cédula do modelo, reduz só a fonte dessa linha (a grade nunca muda). Null = não cabe. */
const _cv = document.createElement('canvas').getContext('2d');
function ajusteFonte(texto) {
  _cv.font = `100px ${FAMILIA}`;
  const w100 = _cv.measureText(texto).width;
  const larg = w100 * G.fonte / 100;
  if (larg <= G.limiteTexto) return G.fonte;
  const tam = Math.floor(G.fonte * G.limiteTexto / larg * 100) / 100;
  return tam >= G.fonteMin ? tam : null;
}
function cabeNaCedula(item) { const l = linhasDe(item); return ['dest', 'cond', 'end', 'ref'].every(k => ajusteFonte(l[k]) !== null); }

const n2 = v => (Math.round(v * 100) / 100).toString();
const rect = (x, y, w, h) => `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}"/>`;
const txtSvg = (x, y, s, tam, extra = '') => `<text x="${n2(x)}" y="${n2(y)}" font-size="${tam}" ${extra} xml:space="preserve">${esc(s)}</text>`;

/** Moldura (grade) de um protocolo + fichinha: igual à da planilha, inclusive o X da margem da fichinha. */
function molduraSvg() {
  const f = G, t = f.T, h = t / 2;
  return `<g fill="#000">`
    + rect(-h, -h, f.W + t, t) + rect(-h, f.H1 - h, f.W + t, t) + rect(-h, f.H - h, f.W + t, t)
    + rect(-h, -h, t, f.H + t) + rect(f.W - h, -h, t, f.H + t)
    + rect(f.medX - h, f.H1, t, f.H - f.H1)
    + rect(f.hairX - f.HAIR / 2, h, f.HAIR, f.H1 - t)
    + `<path stroke="#000" stroke-width="0.14" d="M1.02 175.76L1.5 175.76L32.58 265.31L32.58 266.75L32.1 266.75L1.02 177.2Z"/>`
    + `<path stroke="#000" stroke-width="0.14" d="M32.58 175.76L32.1 175.76L1.02 265.31L1.02 266.75L1.5 266.75L32.58 177.2Z"/>`
    + `</g>`;
}

/** Posição `pos` (0..3) da página. Sem protocolo (item nulo), só a moldura — como a planilha com as células limpas. */
function slotSvg(item, pos, dataTxt) {
  const x0 = G.slotX[pos % 2], y0 = G.stripY[pos >> 1];
  let s = `<g transform="translate(${x0} ${y0})">` + molduraSvg();
  if (!item) return MOLDURA_VAZIA ? s + `</g>` : '';
  const L = linhasDe(item), f = G;
  const fz = k => ajusteFonte(L[k]);
  // logotipo
  s += `<use href="#logo-protocolo" x="${f.logo.x}" y="${f.logo.y}" width="${f.logo.w}" height="${f.logo.h}"/>`;
  // título e margem lateral
  s += `<g font-family="${FAMILIA}" fill="#000">` + txtSvg(f.centroB, f.tituloY, 'PROTOCOLO', f.fonteTitulo, `font-weight="700" text-anchor="middle"`) + `</g>`;
  s += `<g font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-weight="700" fill="#000">` + f.letras.map(([c, x, y]) => txtSvg(x, y, c, f.fonteLetras)).join('') + `</g>`;
  // texto do protocolo
  s += `<g font-family="${FAMILIA}" fill="#000">`;
  s += txtSvg(f.txtX, f.linhas[0], L.dest, fz('dest'));
  s += txtSvg(f.txtX, f.linhas[1], L.cond, fz('cond'));
  s += txtSvg(f.txtX, f.linhas[2], L.end, fz('end'));
  s += txtSvg(f.txtX, f.linhas[3], L.ref, fz('ref'));
  s += txtSvg(f.txtX, f.linhas[4], `${RECUO}São Paulo, ${dataTxt}`, f.fonte);
  s += `<text x="${n2(f.txtX)}" y="${n2(f.linhas[5])}" font-size="${f.fonte}" xml:space="preserve">${FIXO_RECEBEMOS}</text>`;
  s += `<text x="${n2(f.txtX)}" y="${n2(f.linhas[6])}" font-size="${f.fonte}" xml:space="preserve">${FIXO_ASS}</text>`;
  // fichinha: mesmos dados do protocolo, sem título, logotipo, data nem assinatura
  s += txtSvg(f.txtX, f.fich[0], L.dest, fz('dest'));
  s += txtSvg(f.txtX, f.fich[1], L.cond, fz('cond'));
  s += txtSvg(f.txtX, f.fich[2], L.end, fz('end'));
  s += txtSvg(f.txtX, f.fich[3], L.ref, fz('ref'));
  s += `</g></g>`;
  return s;
}

/** Páginas: 4 protocolos por página (faixa 1 esq → faixa 1 dir → faixa 2 esq → faixa 2 dir). Posições vazias ficam em branco. */
function paginasHtml(itens, dataTxt) {
  const total = Math.ceil(itens.length / 4);
  let html = '';
  for (let p = 0; p < total; p++) {
    const corpo = [0, 1, 2, 3].map(i => slotSvg(itens[p * 4 + i] || null, i, dataTxt)).join('');
    html += `<div class="pagina" data-pagina="${p + 1}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${G.pagina[0]} ${G.pagina[1]}" preserveAspectRatio="none" role="img" aria-label="Página ${p + 1} de ${total}">${corpo}</svg></div>`;
  }
  return html;
}

const S = {

/* ----- Campo de condomínio pesquisável ----- */
function buscarConds(q) {
  const t = norm(q.trim());
  if (!t) return CONDS.slice(0, 60);
  const toks = t.split(/\s+/);
  const out = [];
  for (const c of CONDS) {
    const nome = c._n || (c._n = norm(c.nome || ''));
    let s = 0;
    if (c.codigo === t) s = 100;
    else if (/^\d+$/.test(t) && c.codigo.startsWith(t)) s = 80;
    else if (nome.startsWith(t)) s = 60;
    else if (toks.every(k => new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(nome) || c.codigo.startsWith(k))) s = 40;
    else if (nome.includes(t)) s = 20;
    if (s) out.push({ c, s });
  }
  return out.sort((a, b) => b.s - a.s || Number(a.c.codigo) - Number(b.c.codigo)).slice(0, 60).map(x => x.c);
}
const rotuloCond = c => `${c.codigo} — ${c.nome}`;

function criarCombo(raiz, { inputId, onChange }) {
  raiz.innerHTML = `<input class="fin" ${inputId ? `id="${inputId}"` : ''} type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" placeholder="Digite o código ou o nome" aria-label="Condomínio"><button class="combo-clear" type="button" aria-label="Limpar" hidden>×</button><ul class="combo-list" role="listbox" hidden></ul>`;
  const inp = $('input', raiz), ul = $('ul', raiz), x = $('.combo-clear', raiz);
  let valor = null, itens = [], ativo = -1;
  const aberto = () => !ul.hidden;
  const fechar = () => { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); ativo = -1; };
  function pintar() {
    ul.innerHTML = itens.length
      ? itens.map((c, i) => `<li role="option" data-i="${i}" id="${(inputId || 'cb')}-o${i}" aria-selected="${i === ativo}"><b>${esc(c.codigo)}</b><span>${esc(c.nome)}</span></li>`).join('')
      : `<li class="vazio">Nenhum condomínio encontrado</li>`;
    if (ativo >= 0) { const el = ul.children[ativo]; if (el) el.scrollIntoView({ block: 'nearest' }); inp.setAttribute('aria-activedescendant', `${inputId || 'cb'}-o${ativo}`); }
  }
  function abrir() { itens = buscarConds(inp.value === (valor ? rotuloCond(valor) : '') ? '' : inp.value); ativo = itens.length ? 0 : -1; ul.hidden = false; inp.setAttribute('aria-expanded', 'true'); pintar(); }
  function escolher(c) { valor = c; inp.value = c ? rotuloCond(c) : ''; x.hidden = !c; fechar(); onChange && onChange(c); }
  inp.addEventListener('input', () => { if (valor) { valor = null; onChange && onChange(null); } x.hidden = inp.value === ''; abrir(); });
  inp.addEventListener('focus', () => { if (!valor) abrir(); else inp.select(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!aberto()) abrir(); else { ativo = Math.min(itens.length - 1, ativo + 1); pintar(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (aberto()) { ativo = Math.max(0, ativo - 1); pintar(); } }
    else if (e.key === 'Enter' && aberto() && ativo >= 0 && itens[ativo]) { e.preventDefault(); e.stopPropagation(); escolher(itens[ativo]); }
    else if (e.key === 'Escape' && aberto()) { e.preventDefault(); e.stopPropagation(); fechar(); }
    else if (e.key === 'Tab' && aberto() && ativo >= 0 && itens[ativo] && inp.value.trim() !== '' && !valor) { escolher(itens[ativo]); }
  });
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); escolher(itens[Number(li.dataset.i)]); } });
  x.addEventListener('click', () => { escolher(null); inp.focus(); });
  document.addEventListener('mousedown', e => { if (!raiz.contains(e.target)) { if (aberto()) fechar(); } });
  return { get valor() { return valor; }, set valor(c) { escolher(c); fechar(); }, focus() { inp.focus(); }, input: inp };
}

function linhaHtml(l, n) {

/* ----- Revisão e impressão ----- */
const PX_PAGINA = [297 * 96 / 25.4, 210 * 96 / 25.4];
function revisar(itens, origem) {
  S.itens = itens; S.origem = origem; S.impresso = false;
  S.dataTxt = dataExtenso(hoje());
  const total = Math.ceil(itens.length / 4);
  $('#rev-n').textContent = `${itens.length} ${itens.length === 1 ? 'protocolo' : 'protocolos'}`;
  $('#rev-meta').textContent = `· ${total} ${total === 1 ? 'página' : 'páginas'} (A4 paisagem) · São Paulo, ${S.dataTxt}`;
  $('#rev-novo').hidden = true;
  $('#rev-imprimir').textContent = 'Gerar e imprimir';
  $('#prev').innerHTML = paginasHtml(itens, S.dataTxt);
  // envolve cada página para o quadro de revisão (mesma marcação da impressão)
  $$('#prev .pagina').forEach((p, i) => {
    const w = document.createElement('div'); w.className = 'prev-page';
    const tag = document.createElement('div'); tag.className = 'prev-tag'; tag.textContent = `Página ${i + 1} de ${total}`;
    p.replaceWith(w); w.appendChild(p); w.parentNode.insertBefore(tag, w);
  });
  ajustarPreview();
  if (S.pilha[S.pilha.length - 1] !== 'revisar') ir('revisar'); else mostrar('revisar');
}
function ajustarPreview() {
  const disp = $('#conteudo').clientWidth - 64;
  const k = Math.max(0.3, Math.min(1.1, disp / PX_PAGINA[0]));
  $$('#prev .prev-page').forEach(w => { w.style.width = (PX_PAGINA[0] * k) + 'px'; w.style.height = (PX_PAGINA[1] * k) + 'px'; const p = $('.pagina', w); p.style.transform = `scale(${k})`; });
  $$('#prev .prev-tag').forEach(t => { t.style.width = (PX_PAGINA[0] * k) + 'px'; });
}
window.addEventListener('resize', () => { if (!$('#v-revisar').hidden) ajustarPreview(); });

$('#rev-voltar').addEventListener('click', () => { voltar(); });
$('#rev-novo').addEventListener('click', () => { reiniciar(); });
$('#rev-imprimir').addEventListener('click', async () => {

  const agora = dataExtenso(hoje());

  const depois = () => { window.removeEventListener('afterprint', depois); document.title = titulo; $('#print-root').innerHTML = ''; S.impresso = true; $('#rev-novo').hidden = false; $('#rev-imprimir').textContent = 'Imprimir novamente'; $('#rev-novo').focus(); };
  window.addEventListener('afterprint', depois);

function hojeIso() { const d = hoje(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

/* ----- Início assíncrono ----- */
// Carrega a base (nunca falha: no pior caso fica vazia) e só então preenche o que depende dela.
async function inicializarAplicacao() {
  await carregarBaseDados();
  opcoesCarteira();
  $('#rodape').textContent = BASE.baseData ? `Base de ${dataCurta(BASE.baseData)}` : (CONDS.length ? '' : 'Base de dados indisponível — nenhum condomínio carregado.');
  S.linhas = [novaLinha()]; desenharLinhas();

  // Modo de teste (usado só na validação): #teste=<base64 de JSON com itens {codigo, dest, destTexto, ref}>
  if (location.hash.startsWith('#teste=')) {
    try {
      const cfg = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(7)))));
      const itens = cfg.itens.map(x => ({ cond: POR_CODIGO.get(String(x.codigo)) || null, dest: x.dest, destTexto: x.destTexto || '', ref: x.ref }));
      revisar(cfg.ordenar === false ? itens : ordenar(itens), 'custom');
      if (cfg.imprimir) { $('#print-root').innerHTML = paginasHtml(S.itens, S.dataTxt); }
    } catch (err) { document.title = 'ERRO-TESTE: ' + err.message; }
  } else {
    mostrar('home');
  }
  window.__gerador = { faltas, linhasDe, paginasHtml, ordenar, buscarConds, G, refPasta, dataExtenso, cond: c => POR_CODIGO.get(String(c)) || null, base: BASE };
}

inicializarAplicacao().catch(erro => {
  console.error('Erro durante a inicialização:', erro);
  mostrar('home');
});
})();
</script>
